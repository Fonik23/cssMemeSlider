<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cssMemeSlider</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="slider">
    <input type="radio" class="slider__input" id="slide1" name="tab" checked>
    <input type="radio" class="slider__input" id="slide2" name="tab">
    <input type="radio" class="slider__input" id="slide3" name="tab">
    <input type="radio" class="slider__input" id="slide4" name="tab">
    <div class="slider__tabs">
      <label for="slide1" class="slider__label"><span class="slider__tab"></span></label>
      <label for="slide2" class="slider__label"><span class="slider__tab"></span></label>
      <label for="slide3" class="slider__label"><span class="slider__tab"></span></label>
      <label for="slide4" class="slider__label"><span class="slider__tab"></span></label>
    </div>
    <div class="slider__inner">
      <div class="slider__line">
        <div class="slider__element"><img src="./images/slide1.jpg" alt="slide1"></div>
        <div class="slider__element"><img src="./images/slide2.jpg" alt="slide2"></div>
        <div class="slider__element"><img src="./images/slide3.jpg" alt="slide3"></div>
        <div class="slider__element"><img src="./images/slide4.jpg" alt="slide4"></div>
      </div>
    </div>
    <div class="slider__text">
      <div class="slider__text-line">
        <p class="slider__text-item">I'm best of the best</p>
        <p class="slider__text-item">I'm best of the best of the best</p>
        <p class="slider__text-item">Wait. Only one left</p>
        <p class="slider__text-item">Finally! The End</p>
      </div>
    </div>
  </div>
</body>
</html>
